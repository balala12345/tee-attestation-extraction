
L4 = require("L4");
loader = L4.default_loader;
--##############################################################################
--                                FLAGS
--##############################################################################
--------------------------------------------------------------------------------
--                                ned channels
--------------------------------------------------------------------------------
local ned_cfg = loader:new_channel();
local get_version = ned_cfg:svr();
local wait_4_reeagent_channel = loader:new_channel();
local wait_4_reeagent = wait_4_reeagent_channel:svr();
--------------------------------------------------------------------------------
--                                get flags
--------------------------------------------------------------------------------
local is_ese_feature_supported = get_version:module_ese_support();

print(string.format("soter feature flags : ese 0x%x", is_ese_feature_supported));
local sst_register = loader:new_channel();
local sst_rpmb = loader:new_channel();
local sst_vfs = loader:new_channel();
local sst_key = loader:new_channel();
local sst_inf = loader:new_channel();

local ese_register = loader:new_channel();

local utgate_vfs = loader:new_channel();
local utgate_msg = loader:new_channel();
local utgate_irq_state = loader:new_channel();
local utgate_reetime = loader:new_channel();
local utmap_map = loader:new_channel();
local utmap_map_ns = loader:new_channel();

local utgate_to_bta_loader = loader:new_channel();
local vnet_to_bta_loader = loader:new_channel();
local verify_namespace = loader:new_channel();
local sec_manager = loader:new_channel();
local sec_mgr_produce = loader:new_channel();




------------------------------------------------------------------------
--                                uTmap
------------------------------------------------------------------------
loader:start(
{
    caps=
    {
        utmap_map = utmap_map:svr(),
        utmap_map_ns= utmap_map_ns:svr(),
        sigma0 = L4.cast(L4.Proto.Factory, L4.Env.sigma0):create(L4.Proto.Sigma0),
    },
    scheduler = L4.Env.user_factory:create(L4.Proto.Scheduler, 0xa0, 0x90),
    log = {"uTmap", "R"},
}, "rom/uTmap");

------------------------------------------------------------------------
--                                uTgate
------------------------------------------------------------------------
loader:start(
{
    caps =
    {
        utgate_vfs = utgate_vfs:svr(),
        utgate_msg = utgate_msg:svr(),
        utgate_irq_state = utgate_irq_state:svr(),
        utgate_reetime = utgate_reetime:svr(),

        jdb = L4.Env.jdb,
        icu = L4.Env.icu,
        arm_smc = L4.Env.arm_smc,

        sst_key = sst_key,

        utmap_map_ns = utmap_map_ns,

        ned_goon_signal = wait_4_reeagent_channel,
        bta_loader = utgate_to_bta_loader,
    },
    scheduler = L4.Env.user_factory:create(L4.Proto.Scheduler, 0xa0, 0x90),
    log = {"uTgate", "B"},
},"rom/uTgate");

------------------------------------------------------------------------
--                                uTsst
------------------------------------------------------------------------
wait_4_reeagent:wait_4_reeagent();
print("begin to start sst.");
loader:start(
{
    caps =
    {
        sst_register = sst_register:svr(),
        sst_key = sst_key:svr(),
        sst_inf = sst_inf:svr(),

        utgate_msg = utgate_msg,
        utgate_vfs = utgate_vfs,
        utgate_reetime = utgate_reetime,

        utmap_map = utmap_map,
        utmap_map_ns = utmap_map_ns,

        arm_smc = L4.Env.arm_smc,
    },
    log = {"uTsst", "B"},
}, "rom/uTsst");

------------------------------------------------------------------------
--                                uTese
------------------------------------------------------------------------
if (is_ese_feature_supported == 1) then
wait_4_reeagent:wait_4_reeagent();
print("begin to start ese.");
loader:start(
{
    caps =
    {
        ese_register = ese_register:svr(),
	icu = L4.Env.icu,

        utmap_map = utmap_map,
        utmap_map_ns = utmap_map_ns,

        utgate_vfs = utgate_vfs,
        utgate_msg = utgate_msg,
        utgate_irq_state = utgate_irq_state,
        utgate_reetime = utgate_reetime,

        arm_smc = L4.Env.arm_smc,
    },
    scheduler = L4.Env.user_factory:create(L4.Proto.Scheduler, 0xa0, 0x90),
    log = { "ESE-S", "R" },
}, "rom/uTese");
end -- end of is_ese_feature_supported == 1

------------------------------------------------------------------------
--                                uTsecManager
------------------------------------------------------------------------
wait_4_reeagent:wait_4_reeagent();
print("begin to start secmgr.");
loader:start(
{
    caps =
    {
        utmap_map = utmap_map,
        utmap_map_ns = utmap_map_ns,

        utgate_vfs = utgate_vfs,
        utgate_msg = utgate_msg,
        utgate_irq_state = utgate_irq_state,
        utgate_reetime = utgate_reetime,

        sst_register = sst_register,
        sst_rpmb = sst_rpmb,
        sst_vfs = sst_vfs,
        sst_inf = sst_inf,

        VSD = verify_namespace:svr(),
        sec_manager = sec_manager:svr(),
        sec_mgr_produce = sec_mgr_produce:svr(),

        arm_smc = L4.Env.arm_smc,
    },
    scheduler = L4.Env.user_factory:create(L4.Proto.Scheduler, 0xa0, 0x90),
    log = { "uTsecManager" , "R"},
}, "rom/uTsecManager", 12);

------------------------------------------------------------------------
--                                uTbtaLoader
------------------------------------------------------------------------
wait_4_reeagent:wait_4_reeagent();
print("begin to start bta loader.");
loader:start(
{
    caps =
    {
        tee_server_s = utgate_to_bta_loader:svr(),
        tee_server = vnet_to_bta_loader:svr(),

        icu = L4.Env.icu,

        utmap_map_ns = utmap_map_ns,
        utmap_map = utmap_map,

        utgate_vfs = utgate_vfs,
        utgate_msg = utgate_msg,
        utgate_reetime = utgate_reetime,
        utgate_irq_state = utgate_irq_state,

        sst_register = sst_register,
        sst_key = sst_key,
        sst_inf = sst_inf,

        ese_register = ese_register,

        VSD = verify_namespace,
        sec_manager = sec_manager,
        sec_mgr_produce = sec_mgr_produce,

        arm_smc = L4.Env.arm_smc,
    },
    scheduler = L4.Env.user_factory:create(L4.Proto.Scheduler, 0xa0, 0x90),
    log = { "uTbtaLdr" ,"R"},
}, "rom/uTbtaLoader");

wait_4_reeagent:wait_4_reeagent();
print(string.format("all services load done,send finish message."));
utgate_msg:send_finish_launch_server();
wait_4_reeagent:wait_4_reeagent();
print(string.format("all tee load done,send finish message."));
utgate_msg:send_finish_launch_ta();
